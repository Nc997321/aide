# 私有化部署：一条命令起 PostgreSQL + knowledge-server。
#
#   docker compose up -d
#
# 本文件是**交付给客户**的基础文件，刻意不含 build——客户机器上没有源码，
# 镜像从 registry 拉（KB_IMAGE，见 .env.example）。
# 仓库内开发/验证用 overlay 补 build：
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#
# 客户不需要自己装数据库、建库、配连接串——这是自托管产品的标准交付形态。
#
# 需要向量检索时，把 db 的 image 换成 pgvector/pgvector:pg17，
# 然后手动执行 migrations/optional/003_vector.sql（见 README）。

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aide_kb
      POSTGRES_USER: aide
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aide}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aide -d aide_kb"]
      interval: 5s
      timeout: 5s
      retries: 10
    # 刻意不把 5432 映射到宿主机：数据库只在 compose 内部网络可达。
    # 需要排障时再临时加 ports，别默认开。

  knowledge:
    # 默认钉在当前发布版本（交付时随版本更新这个标签）；客户可用 .env 的 KB_IMAGE 覆盖。
    image: ${KB_IMAGE:-registry.example.com/aide/aide-knowledge:0.2.0}
    restart: unless-stopped
    depends_on:
      db:
        # 等 healthcheck 通过再起，否则服务会连不上库就退出重启循环
        condition: service_healthy
    environment:
      KB_DB_URL: postgres://aide:${DB_PASSWORD:-aide}@db:5432/aide_kb
      KB_HOST: 0.0.0.0
      KB_PORT: 8788
      KB_STORAGE_DIR: /app/storage
      # 默认放行 aide 桌面端（打包版 tauri://localhost、dev 形态 http://tauri.localhost）
      # 与本机 tauri dev 的前端 dev server（1420，见 vite.config.ts；5173 是裸 vite 专用，
      # 需要浏览器直连时用 KB_CORS_ALLOWED_ORIGINS 显式加）。客户实际前端地址要显式改它，别用 *
      KB_CORS_ALLOWED_ORIGINS: ${KB_CORS_ALLOWED_ORIGINS:-http://tauri.localhost,tauri://localhost,http://localhost:1420}
    ports:
      - "8788:8788"
    volumes:
      - kbdata:/app/storage

volumes:
  pgdata:
  kbdata:
