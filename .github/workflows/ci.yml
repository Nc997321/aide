name: CI

# 目的：让「跨平台」红线有自动检查——主力开发在 Windows，这里在 macOS 上编译 + 跑测试。
# 只覆盖编译与单元测试；窗口 / 托盘 / 登录 shell PATH 等运行时行为仍需真机验证。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # build 内含构建期守卫（sync-io / overlay-layers / lsp-parity）+ vue-tsc + vite build
      - run: pnpm build
      - run: pnpm test

  rust:
    name: rust crates (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # 与 Tauri 无关的 Host 侧 crate：这是跨平台红线最该守的部分
      - name: test host-side crates
        run: >
          cargo test --manifest-path src-tauri/Cargo.toml
          -p aide-workspace -p aide-core -p aide-link -p aide-host

  tauri-shell:
    name: tauri shell compile probe (macOS)
    runs-on: macos-latest
    # 探针：桌面壳依赖前端产物与 sidecar 资源，CI 里只做占位后 cargo check。
    # 首轮不阻塞整体结论，跑通稳定后去掉 continue-on-error。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: placeholder bundle resources
        run: |
          mkdir -p agent-sidecar/dist src-tauri/remote-kit
          touch agent-sidecar/dist/aide-agent src-tauri/remote-kit/placeholder
      - run: cargo check --manifest-path src-tauri/Cargo.toml -p aide

  sidecar:
    name: agent-sidecar (macOS)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: agent-sidecar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
