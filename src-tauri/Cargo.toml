[package]
name = "aide"
version = "0.8.0"
edition = "2021"

[dependencies]
# 不开 tauri 的 `tracing` feature：它会让 wry 的 eval_script 编译成阻塞版
# （getter! = send_user_message + rx.recv），worker 每次 app.emit 都同步等主线程
# 处理 EvaluateScript 并回执——主线程一 park，读 sidecar stdout 的 tokio task 跟着
# 卡 → sidecar 管道回压 → 后端被拖死、彻底 wedge。去掉后 emit 退回 fire-and-forget
# （send_user_message 变体），worker 不再因主线程卡而死等，后端能跑完、重启可恢复。
# aide 自带的 `tracing = "0.1"` crate 不受影响，只丢掉 Tauri 内部插桩（本就没用）。
tauri = { version = "2", features = [] }

tauri-plugin-shell = "2"

tauri-plugin-window-state = "2"

# 聚合二次启动（资源管理器「打开方式」唤起），把 argv 转发给首个实例
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
serde_json = "1"
keyring = "3"
portable-pty = "0.8"
notify-rust = "4"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
which = "7"
ignore = "0.4"
regex = "1"
arboard = "1"
percent-encoding = "2"
png = "0.17"
base64 = "0.22"
# HTTP 客户端：启动时调 Anthropic GET /v1/models 拉最新模型列表覆盖"系统默认"
# （provider.rs::refresh_system_default_models）。选 ureq 而非 reqwest——轻量同步、
# 无 async-runtime 依赖、配 spawn_blocking 包同步 IO；rustls 跨平台免 OpenSSL。
ureq = { version = "2", features = ["json", "tls"] }
# 剥掉 Windows `resource_dir()` 返回的 `\\?\` verbatim 前缀，避免把扩展长度路径
# 传给外部进程（node 的 realpathSync 处理不了 `\\?\`，会退化到 lstat 'C:' 崩溃）。
dunce = "1"
# 卡死诊断黑匣子：冻结期采样 aide 进程家族的 CPU/内存（仅 system 特性，减编译面）
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# CodeGraph: embedded vector DB, ONNX embedding inference, syntax parsing
qdrant-edge = "0.6"
# 本地 ONNX embedding：直接用 ort 加载 all-MiniLM-L6-v2，禁用 CPU arena + memory_pattern，
# 避免 fastembed 不暴露 arena 配置导致重建索引时 arena 暴涨不归还 OS（aide.exe 3G→6G）。
# 必须显式启用 download-binaries + copy-dylibs：fastembed 之前靠自己的 default feature
# `ort-download-binaries` 间接启用 ort/download-binaries，移除 fastembed 后必须自己显式启用，
# 否则 ONNX Runtime DLL 消失（编译过、运行/打包崩溃）。copy-dylibs 让 DLL 落输出目录供 release。
ort = { version = "=2.0.0-rc.9", default-features = false, features = ["ndarray", "download-binaries", "copy-dylibs"] }
tokenizers = { version = "0.21", default-features = false, features = ["onig"] }
ndarray = { version = "0.16", default-features = false }
tree-sitter = "0.23"
tree-sitter-java = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.23"

# Clipboard file-path reading is platform-specific; declare the platform-only
# crates in target-specific sections so a Windows build doesn't try to compile
# macOS-only crates (and vice versa). arboard (images) is cross-platform above.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
# HKCU 注册表写入：把 Aide 加入「打开方式」列表（per-user、免管理员）
winreg = "0.55"
# SHChangeNotify：写完注册表后通知 shell 刷新文件关联缓存（复用 tauri 已拉的版本）
# 卡死诊断：Win32_System_Threading（OpenThread/SuspendThread/GetThreadContext 跨线程抓主线程栈）
#   + Win32_System_Diagnostics_Debug（CONTEXT/StackWalk 相关；CONTEXT 顶帧解析）
#   + Win32_System_Kernel（CONTEXT 类型，与 Debug 共同 gated）
#   + Win32_System_ProcessStatus（GetModuleFileNameExW 解析停在哪模块）
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSURL", "NSArray"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
