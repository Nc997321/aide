[package]
name = "aide"
version = "0.2.6"
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tracing"] }

tauri-plugin-shell = "2"

tauri-plugin-window-state = "2"

# 聚合二次启动（资源管理器「打开方式」唤起），把 argv 转发给首个实例
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
serde_json = "1"
portable-pty = "0.8"
notify-rust = "4"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
which = "7"
ignore = "0.4"
regex = "1"
arboard = "1"
percent-encoding = "2"
png = "0.17"
dirs = "5"
base64 = "0.22"

# Clipboard file-path reading is platform-specific; declare the platform-only
# crates in target-specific sections so a Windows build doesn't try to compile
# macOS-only crates (and vice versa). arboard (images) is cross-platform above.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
# HKCU 注册表写入：把 Aide 加入「打开方式」列表（per-user、免管理员）
winreg = "0.55"
# SHChangeNotify：写完注册表后通知 shell 刷新文件关联缓存（复用 tauri 已拉的版本）
windows = { version = "0.61", features = ["Win32_UI_Shell"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.2"
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSPasteboardItem"] }
objc2-foundation = { version = "0.2", features = ["NSString", "NSURL", "NSArray"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
