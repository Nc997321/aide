[package]
name = "aide"
version = "1.2.1"
edition = "2021"

# Cargo workspace：`cargo build`（tauri dev/build 走的路径）默认只构建主包。
[workspace]
members = ["crates/aide-workspace", "crates/aide-core", "crates/aide-host", "crates/aide-link"]
default-members = ["."]

[dependencies]
# 不开 tauri 的 `tracing` feature：它会让 wry 的 eval_script 编译成阻塞版
# （getter! = send_user_message + rx.recv），worker 每次 app.emit 都同步等主线程
# 处理 EvaluateScript 并回执——主线程一 park，读 sidecar stdout 的 tokio task 跟着
# 卡 → sidecar 管道回压 → 后端被拖死、彻底 wedge。去掉后 emit 退回 fire-and-forget
# （send_user_message 变体），worker 不再因主线程卡而死等，后端能跑完、重启可恢复。
# aide 自带的 `tracing = "0.1"` crate 不受影响，只丢掉 Tauri 内部插桩（本就没用）。
# 不开 tauri 的 `devtools` feature：release 默认无 WebView2 devtools 能力，WebView2
# AreDevToolsEnabled=false → F12/Ctrl+Shift+I 在 webview 层面失效；前端 Ctrl+Alt+I
# → open_devtools 在 release 因 command 未注册而 invoke reject、catch 静默。需要
# 生产实例活体解剖滚轮定格这类状态病时，`tauri build --features devtools` 打诊断包
# （dev build 由 debug_assertions 自动启用 devtools，无需此 feature）。
# 开 `tray-icon` + `image-png`：点标题栏 X 改为隐藏到托盘（automation 定时任务 /
# agent runtime 需要进程常驻），托盘菜单「退出 Aide」是唯一真退出出口。两者都不在
# tauri default feature 里（default = wry/compression/common-controls-v6/dynamic-acl/
# x11/dbus），不开则 `tauri::tray::TrayIconBuilder` 与 `app.default_window_icon()`
# 都不可用——`image-png` 供 generate_context! 解析 bundle.icon 里的 32x32.png。
# `unstable`：内嵌浏览器 multiwebview 需要——`Window::add_child` / `WebviewBuilder::new`
# 均 `#[cfg(feature="unstable")]`（已核实 tauri 2.11.2 源码）。锁死在 browser/adapter 内使用。
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }

tauri-plugin-shell = "2"

tauri-plugin-window-state = "2"

# 聚合二次启动（资源管理器「打开方式」唤起），把 argv 转发给首个实例
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_repr = "0.1"
serde_json = "1"
# OS keychain 凭据库后端。keyring v3 把平台后端改成 opt-in feature：不开任何后端
# feature 时 keychain set 不落盘——auth token/API key 重启即丢，会话 spawn 拿不到
# ANTHROPIC_AUTH_TOKEN → SDK 报 "Not logged in · Please run /login"。三个平台后端由
# keyring 内部按编译目标自选，同时开启即可（未命中的平台编译为空）。
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native-sync-persistent"] }
notify-rust = "4"
# 工作区文件系统监听（filewatch.rs）：外部改动（资源管理器/cmd/其他编辑器）自动
# 刷新文件树。Windows 后端 = ReadDirectoryChangesW。默认 feature 不含
# crossbeam-channel/flume，闭包式 EventHandler（FnMut blanket impl）不需要任何
# channel feature，事件直接转 std::sync::mpsc。
notify = "8.2"
tokio = { version = "1", features = ["full"] }
once_cell = "1"
# 自动化调度的本地日历运算（weekday/月长/next-fire）。已在依赖树里（tauri 链传递引入），
# 这里只是提升为直接依赖，不增加编译成本。刻意用 NaiveDateTime 做「墙钟时间」语义——
# 「每天 18:30」应跟随本地墙钟，不做 UTC/DST 换算。
chrono = "0.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
which = "7"
ignore = "0.4"
regex = "1"
arboard = "1"
percent-encoding = "2"
# 内嵌浏览器纯核心的 URL 解析/scheme 校验（browser::core::url_guard）。已在依赖树
# （tauri/ureq 传递引入 2.5.8），这里提为直接依赖、同版本、零额外编译成本。
url = "2.5"
png = "0.17"
base64 = "0.22"
# favicon 缓存的键哈希（browser::favicons）。用真哈希而不是 std 的 DefaultHasher：**文件名要在磁盘上
# 跨版本存活**，而 std 明确不保证 DefaultHasher 的算法稳定——换了算法，已缓存的图标会集体变成查不到
# 的孤儿。已在依赖树（tauri-codegen 传递引入 0.10.9），提为直接依赖、同版本、零额外下载。
sha2 = "0.10"
# 文本文件编码兜底解码：read_file_content 原 fs::read_to_string 严格要求合法 UTF-8，
# GBK/GB18030 的中文 .properties/.java 打不开（"stream did not contain valid UTF-8"）。
# encoding_rs 纯 Rust、无 std 依赖，覆盖 GB18030/GBK/GB2312/Shift-JIS/Big5/UTF-16，
# 在 UTF-8 失败时按 GB18030 兜底，BOM 判定 UTF-16/UTF-8 BOM。
encoding_rs = "0.8"
# HTTP 客户端：启动时调 Anthropic GET /v1/models 拉最新模型列表覆盖"系统默认"
# （provider.rs::refresh_system_default_models）。选 ureq 而非 reqwest——轻量同步、
# 无 async-runtime 依赖、配 spawn_blocking 包同步 IO；rustls 跨平台免 OpenSSL。
ureq = { version = "2", features = ["json", "tls"] }
# 远程工作区扩展镜像：插件 / 用户扩展打成 tar.gz 经 stdin 流到目标机（remote_workspace::mirror）。
tar = "0.4"
flate2 = "1"
# 剥掉 Windows `resource_dir()` 返回的 `\\?\` verbatim 前缀，避免把扩展长度路径
# 传给外部进程（node 的 realpathSync 处理不了 `\\?\`，会退化到 lstat 'C:' 崩溃）。
dunce = "1"
# 卡死诊断黑匣子：冻结期采样 aide 进程家族的 CPU/内存（仅 system 特性，减编译面）
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
# 远程控制网关：出站 WS 客户端（连自建中继）
tokio-tungstenite = "0.24"
futures-util = "0.3"
# 配对码 / token / device_id 生成
rand = "0.8"

# 工作区操作（fs / 搜索 / git）的唯一实现：桌面命令是它的薄包装，远程工作区的
# aide-host 在目标机上跑同一份代码（见 src/remote_workspace/）。
aide-workspace = { path = "crates/aide-workspace" }
# Host 核心：命令表 + Host 自持状态，本机进程内直调、远程由 aide-host 嵌入（见 src/host_door.rs）。
aide-core = { path = "crates/aide-core" }
# 远程工作区的桌面 ↔ aide-host 协议类型与可转发命令清单（只用其 lib）
aide-host = { path = "crates/aide-host" }
lsp-types = "0.97.0"

# Clipboard file-path reading is platform-specific; declare the platform-only
# crates in target-specific sections so a Windows build doesn't try to compile
# macOS-only crates (and vice versa). arboard (images) is cross-platform above.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
# 桌面通知的点击激活回调（notify-rust 没接通 on_activated，直接用它）：
# 与 notify-rust 同源同版本（它改名为 winrt_notification），不新增依赖树。
tauri-winrt-notification = "0.7"
# HKCU 注册表写入：把 Aide 加入「打开方式」列表（per-user、免管理员）
winreg = "0.55"
# SHChangeNotify：写完注册表后通知 shell 刷新文件关联缓存（复用 tauri 已拉的版本）
# 卡死诊断：Win32_System_Threading（OpenThread/SuspendThread/GetThreadContext 跨线程抓主线程栈）
#   + Win32_System_Diagnostics_Debug（CONTEXT/StackWalk 相关；CONTEXT 顶帧解析）
#   + Win32_System_Diagnostics_ToolHelp（CreateToolhelp32Snapshot 枚举渲染进程线程）
#   + Win32_System_Kernel（CONTEXT 类型，与 Debug 共同 gated）
#   + Win32_System_ProcessStatus（GetModuleFileNameExW 解析停在哪模块）
windows = { version = "0.61", features = [
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Kernel",
    "Win32_System_ProcessStatus",
    "Win32_Foundation",
    # Job Object（runtime/job_object.rs）：aide.exe 被强杀时由内核连根收掉 sidecar
    # 整棵树（claude.exe / rust-analyzer / tsserver）。JobObjects 用到 Threading 的
    # IO_COUNTERS；CreateJobObjectW 在 windows crate 里挂在 Security 之下（签名带
    # SECURITY_ATTRIBUTES），两个特性都必须开。
    "Win32_System_JobObjects",
    "Win32_Security",
] }
# 内嵌浏览器 agent 路径：裸 WebView2（ExecuteScript 带返回值 / CallDevToolsProtocolMethod）。
# 已在依赖树（tauri → tauri-runtime-wry → wry 传递引入，Cargo.lock 现值 0.38.2），
# 提为直接依赖、**严格同版本**、零额外编译成本——不新增第二份 windows
# （webview2-com-sys 0.38.2 要 windows 0.61.3 / windows-core 0.61.2，与上面的 0.61 同大版本）。
# **只准在 browser/adapter/ 里 use**（browser/mod.rs 的端口隔离红线）。
webview2-com = "0.38.2"

[target.'cfg(target_os = "macos")'.dependencies]
# 不单独声明 objc2：由下面两个 crate 传递引入（0.2.x 这一代依赖 objc2 0.5）。
# 曾写成 `objc2 = "0.2"`（指向更老的 0.2.7，只有 `Id` 没有 `Retained`），与它们不同代，
# 桌面壳在 macOS 上编不过。
objc2-app-kit = { version = "0.2", features = ["NSPasteboard", "NSPasteboardItem"] }
# NSEnumerator：NSArray::iter / IntoIterator 都挂在它后面（clipboard.rs 遍历剪贴板条目用）
objc2-foundation = { version = "0.2", features = ["NSString", "NSURL", "NSArray", "NSEnumerator"] }

[dev-dependencies]
# test feature 提供 tauri::test::mock_app（MockRuntime）——单测里验证事件播报/静默
# 分类（如 lsp-server-dead 只在异常死亡时 emit）。仅测试构建生效，不进发布包。
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# 诊断包编译开关：启用 tauri devtools，使 release 也能开 WebView2 devtools 活体解剖
# 状态病（滚轮定格等）。默认不开——生产包禁 devtools 是安全要求。dev build 自动有。
devtools = ["tauri/devtools"]
