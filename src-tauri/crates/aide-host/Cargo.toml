[package]
name = "aide-host"
version = "0.8.0"
edition = "2021"
description = "Aide remote workspace host: runs on a WSL distro / SSH server (no GUI needed) and serves the desktop app over stdio JSON-RPC (workspace ops via aide-workspace + the agent runtime)."

# 纯 Rust、无 C 依赖：要能以 x86_64/aarch64-unknown-linux-musl 静态链接，
# 一个二进制跑遍任意发行版（目标机不装任何东西）。新增依赖前先确认这一点。
[dependencies]
aide-workspace = { path = "../aide-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "process", "sync", "time"] }
base64 = "0.22"

[[bin]]
name = "aide-host"
path = "src/main.rs"
