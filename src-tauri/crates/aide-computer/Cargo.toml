[package]
name = "aide-computer"
version = "2.1.1"
edition = "2021"
description = "Computer use for Aide agents: read windows through UI Automation, act with real input, verify. Tauri-free; the desktop shell plugs it into the agent bridge."

# 设计：docs/superpowers/specs/2026-10-19-computer-use-design.md
# 平台技术（UIA / SendInput / 截屏）只准出现在 src/adapter/windows/；其余模块是纯 Rust，任何平台都能单测。

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
base64 = "0.22"
# 截图编码（纯 Rust，依赖树里已有这一版）
png = "0.17"

[dev-dependencies]
# examples/drive.rs 打日志到 stderr（钩子是否装上、接管是否触发）
tracing-subscriber = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_Storage_Xps",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Security",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_Shell_PropertiesSystem",
] }
