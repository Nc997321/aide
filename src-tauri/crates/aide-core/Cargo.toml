[package]
name = "aide-core"
version = "0.8.0"
edition = "2021"
description = "Aide Host core: the command table and host state behind every front door (desktop in-process, aide-host on WSL / SSH). No Tauri dependency."

# 与 aide-host 同一约束：不依赖任何系统 C 库（aide-host 以 musl 静态链接嵌入本 crate）；
# crate 自带的 C/汇编静态编入可以。新增依赖前先确认这一点。
[dependencies]
aide-workspace = { path = "../aide-workspace" }
# codegraph 主/runner 共用的轻量 DTO 与协议（只依赖 serde）
codegraph-core = { path = "../codegraph-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
regex = "1"
tracing = "0.1"
dunce = "1"
base64 = "0.22"
# HTTPS（供应商连接测试 / 模型刷新）：同步、无 async runtime；rustls 经 ring 静态编入（见上方约束）。
ureq = { version = "2", features = ["json", "tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
# 终端 PTY：Unix 走 libc openpty（musl 自带），Windows 走 ConPTY——不引入系统 C 库。
portable-pty = "0.8"
which = "7"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
