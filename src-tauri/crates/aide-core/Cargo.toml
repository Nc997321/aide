[package]
name = "aide-core"
version = "0.8.0"
edition = "2021"
description = "Aide Host core: the command table and host state behind every front door (desktop in-process, aide-host on WSL / SSH). No Tauri dependency."

# 与 aide-host 同一约束：不依赖任何系统 C 库（aide-host 以 musl 静态链接嵌入本 crate）；
# crate 自带的 C/汇编静态编入可以。新增依赖前先确认这一点。
[dependencies]
aide-workspace = { path = "../aide-workspace" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
regex = "1"
tracing = "0.1"
dunce = "1"
base64 = "0.22"
# HTTPS（供应商连接测试 / 模型刷新）：同步、无 async runtime；rustls 经 ring 静态编入（见上方约束）。
ureq = { version = "2", features = ["json", "tls"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "process", "io-util", "time"] }
# 终端 PTY：Unix 走 libc openpty（musl 自带），Windows 走 ConPTY——不引入系统 C 库。
portable-pty = "0.8"
which = "7"
# 自动化调度的本地日历运算（NaiveDateTime 墙钟语义：「每天 18:30」跟随本地墙钟）
chrono = "0.4"
# LSP 协议类型（纯 Rust）
lsp-types = "0.97.0"
percent-encoding = "2"
futures-util = "0.3"
# Aide Link：Host 自己的手机网关（协议 / 安全通道 / 传输适配器）。aide-link 不依赖 aide-core，没有环。
aide-link = { path = "../aide-link", features = ["transport"] }
# 语言包安装（lsp/packs）：下载件的解压与完整性校验。全部纯 Rust（flate2 走 miniz_oxide 后端）。
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
sha2 = "0.10"
# 配对二维码（纯 Rust，输出 SVG 给任何前端直接显示）
qrcode = { version = "0.14", default-features = false, features = ["svg"] }

# Windows：sidecar 整棵进程树收进 KILL_ON_JOB_CLOSE 的 Job Object（runtime/job_object.rs）。
# 与桌面同一 windows crate 版本（不新增第二份）。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_Security",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
