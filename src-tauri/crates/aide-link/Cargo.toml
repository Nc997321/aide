[package]
name = "aide-link"
version = "1.2.1"
edition = "2021"
description = "Aide Link: the protocol between a Host and its remote clients (phone). Frames, exposure catalog, pairing/auth and the per-connection session state machine — transport-agnostic, no Tauri, no aide-core dependency."

# 与 aide-host 同一约束：不依赖任何系统 C 库（aide-host 以 musl 静态链接嵌入本 crate）。
# 本 crate **不依赖 aide-core**：它只定义「手机能对 Host 说什么」，Host 经 `Backend` / `EventBus`
# 两个端口接进来——协议与 Host 实现可以各自演进。
[features]
# 传输适配器（直连 WebSocket / 中继客户端）。协议核心不需要它们；aide-core / 测试 Host 打开。
transport = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt", "macros", "net", "io-util"] }
# wss:// 经 rustls（ring 的 C / 汇编静态编入，不引入系统 C 库）。Link 帧本身端到端加密，ws:// 也安全——
# 但中继常在 TLS 反代后面，两种都要能连。
tokio-tungstenite = { version = "0.24", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true }
rand = "0.8"
tracing = "0.1"
# 安全通道：Noise（IK / IKpsk2，X25519 + ChaChaPoly + SHA256）。默认解析器 = 纯 Rust（RustCrypto），
# 不引入任何系统 C 库，aide-host 的 musl 静态链接不受影响。
snow = "0.9"
base64 = "0.22"
# X25519 公钥推导（snow 的默认解析器本来就带它，不新增第二份）
x25519-dalek = { version = "2", features = ["static_secrets"] }
percent-encoding = "2"

[dev-dependencies]
# 本地测试 Host 在终端打印二维码（examples/test_host.rs）
qrcode = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
aide-link = { path = ".", features = ["transport"] }
# 真实中继（进程内）做端到端：relay-server 是独立仓内 crate，只当测试依赖
aide-relay = { path = "../../../relay-server" }
