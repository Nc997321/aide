<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aide 远程 · 图片发送与识图搜索原型（应用本体）</title>
<style>
  /* ===== token：镜像 entry color.json（浅色），与 design/remote v3 原型一致 ===== */
  :root {
    --page-bg: #F1F3F5;
    --card: #FFFFFF;
    --input-bg: #F5F6FA;
    --text: #1D2129;
    --text-2: #86909C;
    --accent: #0A59F7;
    --accent-weak: rgba(10,89,247,.08);
    --ok: #00B42A;
    --warn: #FF7D00;
    --warn-weak: rgba(255,125,0,.1);
    --danger: #F53F3F;
    --danger-weak: rgba(245,63,63,.1);
    --line: #E5E6EB;
    --disabled: #C9CDD4;
    --radius: 12px;
    --shadow: 0 2px 10px rgba(29,33,41,.05);
    --mono: Consolas, "Cascadia Code", monospace;
    --ease: .18s cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--page-bg); color: var(--text); overflow: hidden;
    font: 14px/1.6 "HarmonyOS Sans SC", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  button { font-family: inherit; cursor: pointer; }
  .page { display: none; height: 100vh; max-width: 420px; margin: 0 auto; flex-direction: column; position: relative; }
  .page.show { display: flex; }

  /* ===== 状态栏 ===== */
  .statusbar {
    height: 38px; flex: none; display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; font-size: 12.5px; font-weight: 600;
  }
  .sb-icons { display: flex; align-items: center; gap: 6px; }

  /* ===== 通用小组件 ===== */
  .spinner {
    width: 14px; height: 14px; flex: none; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: rot .7s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--ok); }
  .dot.warn { background: var(--warn); animation: pulse 1.4s ease-in-out infinite; }
  .dot.info { background: var(--accent); }
  @keyframes pulse { 50% { opacity: .4; } }
  .logo {
    width: 56px; height: 56px; border-radius: 16px; flex: none;
    background: linear-gradient(135deg, #4C8DFF, #0A59F7); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800; box-shadow: 0 6px 18px rgba(10,89,247,.28);
  }

  /* ===== 顶栏 ===== */
  .ch-top {
    flex: none; display: flex; align-items: center; gap: 4px;
    padding: 8px 10px 10px; background: var(--card); border-bottom: 1px solid var(--line);
    position: relative; z-index: 4;
  }
  .icon-btn {
    width: 34px; height: 34px; flex: none; display: flex; align-items: center; justify-content: center;
    border-radius: 10px; border: none; background: none; color: var(--text-2);
    transition: background var(--ease);
  }
  .icon-btn:active { background: var(--input-bg); }
  .icon-btn.ch-stop { color: var(--disabled); }
  .icon-btn.ch-stop.can { color: var(--danger); }
  .icon-btn.ch-stop.can:active { background: var(--danger-weak); }
  .ch-title { flex: 1; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  .ch-name { font-size: 16px; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ch-sub { display: inline-flex; align-items: center; gap: 5px; margin-top: 3px; font-size: 10.5px; font-weight: 500; color: var(--text-2); }
  .ch-sub .dot { width: 6px; height: 6px; background: var(--accent); }

  /* ===== toast（压过选图面板 z9 与全屏预览 z11） ===== */
  .ch-toast {
    position: absolute; top: 96px; left: 50%; transform: translateX(-50%) translateY(-8px);
    display: flex; align-items: center; gap: 7px; padding: 8px 15px; border-radius: 99px; z-index: 12;
    font-size: 12px; font-weight: 600; color: #fff; background: rgba(29,33,41,.9);
    box-shadow: 0 8px 24px rgba(0,0,0,.18); opacity: 0; pointer-events: none;
    transition: all .3s cubic-bezier(.2,.8,.2,1); white-space: nowrap; max-width: 88%; overflow: hidden;
  }
  .ch-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .ch-toast .dot { width: 6px; height: 6px; }

  /* ===== 空态 ===== */
  .ch-empty {
    display: none; flex: 1; flex-direction: column; align-items: center; justify-content: center;
    gap: 7px; padding: 30px; text-align: center;
  }
  .ch-empty.show { display: flex; }
  .ch-empty b { font-size: 16px; }
  .ch-empty p { font-size: 12px; color: var(--text-2); }
  .ch-empty p em { font-style: normal; color: var(--accent); font-weight: 600; }

  /* ===== 消息区 ===== */
  .ch-msgs { flex: 1; overflow-y: auto; padding: 14px 14px 12px; }
  .ch-msgs::-webkit-scrollbar { width: 0; }
  .m-time { text-align: center; font-size: 11px; color: var(--text-2); margin: 2px 0 12px; }
  .m-sys {
    display: flex; align-items: center; gap: 10px; text-align: center;
    font-size: 11px; color: var(--accent); margin: 10px 0;
  }
  .m-sys::before, .m-sys::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .m-row { display: flex; margin-bottom: 14px; }
  .m-row.user { justify-content: flex-end; }
  .m-msg { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; max-width: 88%; }
  .m-bubble-user {
    max-width: 100%; padding: 10px 13px; font-size: 14.5px; line-height: 1.55;
    color: #fff; background: var(--accent); border-radius: 16px 16px 4px 16px;
    white-space: pre-wrap; word-break: break-word;
  }
  /* 图片栅格：图先文后；1 张原比例，2 张 132 方格，3+ 张 92 三列 */
  .g-grid { display: grid; gap: 5px; grid-template-columns: repeat(3, 92px); }
  .g-grid.n2 { grid-template-columns: repeat(2, 132px); }
  .g-grid.n1 { display: block; }
  .gi {
    width: 100%; height: 92px; object-fit: cover; border-radius: 10px; display: block;
    cursor: zoom-in; background: var(--input-bg);
  }
  .g-grid.n2 .gi { height: 132px; }
  .g-grid.n1 .gi { width: auto; height: auto; max-width: 200px; max-height: 220px; }
  /* 视频卡：首帧 poster + 时长 + 播放钮 */
  .v-card { position: relative; height: 92px; border-radius: 10px; overflow: hidden; background: var(--input-bg); cursor: zoom-in; }
  .v-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .g-grid.n2 .v-card { height: 132px; }
  .g-grid.n1 .v-card { max-width: 200px; }
  .v-dur {
    position: absolute; right: 5px; bottom: 5px; padding: 1px 6px; border-radius: 4px;
    background: rgba(0,0,0,.62); color: #fff; font-size: 9.5px; font-family: var(--mono);
  }
  .v-play {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 30px; height: 30px; border-radius: 50%; background: rgba(15,16,20,.5); color: #fff;
    display: flex; align-items: center; justify-content: center; pointer-events: none;
  }
  /* 文件卡：跨满列横条 */
  .f-card {
    grid-column: 1 / -1; display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
  }
  .f-card .af-ic { width: 34px; height: 34px; border-radius: 10px; font-size: 9px; }
  .f-card .f-meta { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .f-card .f-name { font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-card .f-size { font-size: 10.5px; color: var(--text-2); }
  .m-assistant { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .m-text { font-size: 15px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .cursor {
    display: inline-block; width: 2px; height: 1em; margin-left: 1px;
    background: var(--accent); vertical-align: -2px; animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .m-usage { font-family: var(--mono); font-size: 11px; color: var(--text-2); text-align: right; }

  /* 思考卡（折叠；live = 流式进行中） */
  .think { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  .think-h {
    display: flex; align-items: center; gap: 7px; padding: 10px 12px;
    font-size: 13px; color: var(--text-2); cursor: pointer; user-select: none;
  }
  .think-h svg { flex: none; }
  .think-h .lb { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .think-h .chev { margin-left: auto; display: flex; transition: transform var(--ease); }
  .think.open .chev { transform: rotate(180deg); }
  .think-b {
    display: none; margin: 0 12px; border-top: 1px dashed var(--line); padding: 10px 2px 12px;
    font-size: 13px; line-height: 1.65; color: var(--text-2); white-space: pre-wrap; word-break: break-word;
  }
  .think.open .think-b { display: block; }
  .think.live .think-b { display: block; border-top: none; padding-top: 0; }

  /* 瞬态工具行（回合结束淡出，不进历史） */
  .act { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--text-2); transition: opacity .45s; }
  .act.fade { opacity: 0; }
  .act .tname { color: var(--text); font-weight: 600; flex: none; }
  .act .targ { font-family: var(--mono); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== 输入区 ===== */
  .ch-input {
    flex: none; display: flex; flex-direction: column; gap: 8px;
    padding: 8px 12px 14px; background: var(--card); border-top: 1px solid var(--line);
    position: relative; z-index: 4;
  }
  /* 模型守卫警示行：有附件且当前模型不支持图片时出现 */
  .img-guard {
    display: none; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 10px;
    background: var(--warn-weak); color: var(--warn); font-size: 12px; font-weight: 600; cursor: pointer;
  }
  .img-guard.show { display: flex; animation: rise .25s; }
  .img-guard .g-ic { display: flex; flex: none; }
  .img-guard.shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  /* 附件预览条：输入行上方，有图才出现 */
  .at-strip { display: none; gap: 8px; padding: 2px 1px 0; overflow-x: auto; }
  .at-strip.show { display: flex; animation: rise .25s; }
  .at-strip::-webkit-scrollbar { height: 0; }
  .at-thumb { position: relative; width: 64px; height: 64px; flex: none; border-radius: 12px; overflow: hidden; background: var(--input-bg); }
  .at-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .at-rm {
    position: absolute; top: 3px; right: 3px; width: 18px; height: 18px; border-radius: 50%;
    border: none; padding: 0; background: rgba(29,33,41,.72); color: #fff;
    display: flex; align-items: center; justify-content: center;
  }
  .at-busy { position: absolute; inset: 0; background: rgba(255,255,255,.66); display: flex; align-items: center; justify-content: center; }
  .at-add {
    width: 64px; height: 64px; flex: none; border-radius: 12px;
    border: 1.5px dashed var(--disabled); background: none; color: var(--text-2);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
  }
  .at-add small { font-size: 9px; font-weight: 600; }
  /* 视频缩略图：时长角标 */
  .at-thumb .v-badge {
    position: absolute; left: 4px; bottom: 4px; padding: 1px 5px; border-radius: 4px;
    background: rgba(0,0,0,.62); color: #fff; font-size: 9px; font-family: var(--mono); line-height: 1.5;
  }
  /* 文件附件：横卡（图标 + 名称 + 大小） */
  .at-file {
    position: relative; width: 152px; height: 64px; flex: none; border-radius: 12px;
    border: 1px solid var(--line); background: var(--card);
    display: flex; align-items: center; gap: 9px; padding: 0 10px;
  }
  .at-file .af-name { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .at-file .af-sub { font-size: 9.5px; color: var(--text-2); white-space: nowrap; }
  .at-file .af-meta { flex: 1; min-width: 0; }
  .at-file .at-rm { position: static; width: 16px; height: 16px; flex: none; background: none; color: var(--text-2); }
  /* 扩展名徽标（附件条 / 消息卡 / 文件列表共用） */
  .af-ic { flex: none; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; letter-spacing: .3px; }
  .at-file .af-ic { width: 32px; height: 32px; font-size: 8.5px; }
  .ext-ets { background: #7B61FF; } .ext-pdf { background: #F53F3F; } .ext-docx { background: #0A59F7; }
  .ext-zip { background: #FF7D00; } .ext-csv { background: #00B42A; }

  .ch-ta-row { display: flex; align-items: flex-end; gap: 8px; }
  .ch-ta-wrap {
    flex: 1; display: flex; align-items: flex-end; background: var(--input-bg); border-radius: 20px;
    border: 1px solid transparent; transition: all var(--ease);
  }
  .ch-ta-wrap:focus-within { border-color: var(--accent); background: var(--card); box-shadow: 0 0 0 2.5px var(--accent-weak); }
  .ch-input textarea {
    flex: 1; resize: none; border: none; outline: none; background: none;
    padding: 10px 14px; font: 14px/1.5 inherit; color: var(--text); max-height: 104px;
  }
  .ch-input textarea::placeholder { color: var(--text-2); }
  .ch-send {
    width: 34px; height: 34px; flex: none; border-radius: 50%; border: none; margin: 3px 3px 3px 0;
    background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 8px rgba(10,89,247,.25); transition: all var(--ease);
  }
  .ch-send:active:not(:disabled) { transform: scale(.9); }
  .ch-send:disabled { background: var(--disabled); box-shadow: none; }

  /* 工具行 chips + 浮层（＋ 在最右端，与上方发送按钮对齐） */
  .ch-bar { display: flex; align-items: center; gap: 8px; }
  .plus-wrap { position: relative; margin-left: auto; }
  .ch-plus {
    width: 32px; height: 32px; flex: none; border-radius: 10px;
    border: 1px solid var(--line); background: var(--input-bg); color: var(--text-2);
    display: flex; align-items: center; justify-content: center; transition: all var(--ease);
  }
  .ch-plus:active:not(:disabled) { background: var(--card); border-color: var(--accent); color: var(--accent); }
  .ch-plus:disabled { opacity: .5; }
  .plus-pop {
    position: absolute; right: 0; bottom: calc(100% + 8px); width: 224px; padding: 6px; z-index: 6;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 36px rgba(29,33,41,.14);
    opacity: 0; visibility: hidden; transform: translateY(6px) scale(.97);
    transform-origin: bottom right; transition: all var(--ease);
  }
  .plus-pop.show { opacity: 1; visibility: visible; transform: none; }
  .plus-pop .opt { padding: 9px 10px; }
  .plus-pop .opt-name { font-size: 13.5px; }
  .plus-ic {
    width: 30px; height: 30px; flex: none; border-radius: 9px; background: var(--input-bg); color: var(--accent);
    display: flex; align-items: center; justify-content: center;
  }
  .ef-chip, .md-chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--input-bg);
    font-size: 11px; font-weight: 600; color: var(--text-2);
  }
  .ef-chip .ef-ic { display: flex; color: var(--warn); }
  .ef-chip .ef-ic svg { width: 11px; height: 11px; }
  .ef-chip svg:last-child, .md-chip svg:last-child { opacity: .6; }
  .md-chip .md-ic { display: flex; color: var(--accent); }
  .md-chip .md-label { max-width: 128px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .md-wrap, .ef-wrap { position: relative; }
  .md-pop, .ef-pop {
    position: absolute; left: 0; bottom: calc(100% + 8px); width: 236px; padding: 6px; z-index: 6;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 12px 36px rgba(29,33,41,.14);
    opacity: 0; visibility: hidden; transform: translateY(6px) scale(.97);
    transform-origin: bottom left; transition: all var(--ease);
  }
  .md-pop.show, .ef-pop.show { opacity: 1; visibility: visible; transform: none; }
  .opt {
    width: 100%; display: flex; align-items: center; gap: 11px; padding: 11px;
    border-radius: 14px; border: 1.5px solid transparent; background: none;
    text-align: left; color: var(--text); transition: all var(--ease); margin-bottom: 6px;
  }
  .opt:active { background: var(--input-bg); }
  .opt.on { border-color: var(--accent); background: var(--accent-weak); }
  .opt:last-child { margin-bottom: 0; }
  .opt-txt { flex: 1; min-width: 0; }
  .opt-name { display: block; font-size: 14px; font-weight: 600; }
  .opt-id { font-style: normal; font-family: var(--mono); font-size: 10px; color: var(--text-2); font-weight: 400; margin-left: 6px; }
  .opt-desc { display: block; font-size: 11px; color: var(--text-2); margin-top: 1px; }
  .opt-check { flex: none; color: var(--accent); opacity: 0; transition: opacity var(--ease); }
  .opt.on .opt-check { opacity: 1; }
  .pv-ic {
    width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--input-bg);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .ef-pop .pv-ic { width: 30px; height: 30px; font-size: 13px; }
  /* 模型浮层「不支持图片」标 */
  .noimg {
    display: inline-flex; align-items: center; padding: 1px 7px; margin-left: 6px; border-radius: 99px;
    background: var(--warn-weak); color: var(--warn); font-size: 10px; font-weight: 700; vertical-align: 1px;
  }

  /* ===== 系统选图面板（模拟 PhotoViewPicker：免权限 · 多选上限 5） ===== */
  .pk-mask {
    position: absolute; inset: 0; z-index: 9; background: var(--card);
    display: flex; flex-direction: column;
    transform: translateY(100%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
  }
  .pk-mask.show { transform: none; }
  .pk-top { flex: none; display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  .pk-top b { font-size: 15px; }
  .pk-cancel { border: none; background: none; color: var(--text-2); font-size: 14px; padding: 4px 2px; }
  .pk-done { border: none; border-radius: 99px; padding: 6px 15px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; }
  .pk-done:disabled { background: var(--disabled); }
  /* 顶层分段：图片（PhotoViewPicker·IMAGE）/ 视频（VIDEO）/ 文件（DocumentViewPicker） */
  .pk-segs { flex: none; display: flex; gap: 8px; padding: 12px 14px 10px; }
  .pk-seg {
    flex: 1; padding: 7px 0; border-radius: 99px; border: 1px solid var(--line); background: none;
    font-size: 13px; color: var(--text-2); transition: all var(--ease);
  }
  .pk-seg.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .pk-tabs { flex: none; display: flex; gap: 20px; padding: 8px 16px 0; border-bottom: 1px solid var(--line); }
  .pk-tab { position: relative; border: none; background: none; padding: 2px 1px 10px; font-size: 13.5px; color: var(--text-2); }
  .pk-tab.on { color: var(--text); font-weight: 700; }
  .pk-tab.on::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2.5px; border-radius: 2px; background: var(--accent); }
  .pk-n { font-style: normal; font-size: 10px; color: var(--text-2); margin-left: 3px; font-weight: 400; }
  .pk-grid { flex: 1; overflow-y: auto; padding: 4px 3px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; align-content: start; }
  .pk-grid::-webkit-scrollbar { width: 0; }
  .pk-it { position: relative; aspect-ratio: 1/1; border: none; padding: 0; border-radius: 6px; overflow: hidden; background: var(--input-bg); }
  .pk-it img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* 选中环：::after 盖在 img 之上，inset 描边才可见 */
  .pk-it.on::after { content: ""; position: absolute; inset: 0; border-radius: 6px; box-shadow: inset 0 0 0 3px var(--accent); }
  .pk-ord {
    position: absolute; top: 6px; right: 6px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    display: none; align-items: center; justify-content: center;
  }
  .pk-it.on .pk-ord { display: flex; }
  .pk-vdur {
    position: absolute; left: 6px; bottom: 6px; padding: 1px 5px; border-radius: 4px;
    background: rgba(0,0,0,.62); color: #fff; font-size: 9.5px; font-family: var(--mono);
  }
  /* 文件段：列表行 */
  .pk-list { flex: 1; overflow-y: auto; display: none; }
  .pk-list::-webkit-scrollbar { width: 0; }
  .pk-file {

  .pk-foot { flex: none; padding: 9px; text-align: center; font-size: 11.5px; color: var(--text-2); border-top: 1px solid var(--line); }

  /* ===== 全屏预览 ===== */
  .lb-mask {

/* 模拟端侧处理：图片/视频重编码逐张错峰（340ms + k*260ms），文件即时 */
function attachItems(items, animate) {
  const room = MAX - at.length;
  items.slice(0, Math.max(0, room)).forEach((nit, k) => {
    const it = { ...nit, enc: animate && nit.type !== "file" };
    at.push(it);
    if (it.enc) setTimeout(() => { it.enc = false; renderStrip(); updateInputState(); }, 340 + k * 260);
  });
  if (items.length > room) flashHint(`最多附 ${MAX} 个附件`, "warn");
  renderStrip();
  updateInputState();
  updateGuard();
}
function attachIds(ids, animate) {
  attachItems(ids.map(id => ({ id, type: "img", src: LIB[id].src })), animate);
}
function waitForEncode() {
  return new Promise(res => {
    const t0 = Date.now();
    const iv = setInterval(() => {
      if (!at.some(x => x.enc) || Date.now() - t0 > 4200) { clearInterval(iv); res(); }
    }, 120);
  });
}
function updateGuard() {
  const bad = at.length > 0 && !activeModel().img;
  const g = chat.querySelector(".img-guard");
  g.classList.toggle("show", bad);
  if (bad) g.querySelector(".txt").textContent = `${activeModel().displayName} 不支持图片/文件输入 · 点此切换模型或移除附件`;
}

/* 附件回执（图片 / 视频 / 文件混排） */
function tally(items) {

function descParts(c) {

  return parts.join("、");
}

async function typeInto(node, text, myId, cps) {
  for (const ch of text) {
    if (myId !== chat._runId) return false;
    node.insertBefore(document.createTextNode(ch), node.querySelector(".cursor"));
    scrollBottom();
    await sleep(cps);
  }
  return true;
}
async function playScript(script) {
  const myId = chat._runId;
  const mount = chat.querySelector(".live-slot");
  const row = el('<div class="m-row"><div class="m-assistant"></div></div>');
  mount.appendChild(row);
  scrollBottom();
  const box = row.firstChild;
  for (const step of script) {
    if (myId !== chat._runId) return;
    if (step.t === "think") {
      const d = el(`<div class="think live open"><div class="think-h">${ICONS.spark}<span class="lb">思考中…</span><span class="chev" style="display:none">${ICONS.chev}</span></div><div class="think-b"><span class="cursor"></span></div></div>`);
      d.querySelector(".think-h").addEventListener("click", () => {
        if (!d.classList.contains("live")) d.classList.toggle("open");
      });
      box.appendChild(d);
      scrollBottom();
      const body = d.querySelector(".think-b");
      if (!await typeInto(body, step.text, myId, 14)) return;
      body.querySelector(".cursor").remove();
      d.querySelector(".lb").textContent = `已思考 ${Math.max(1, Math.round(step.text.length / 40))} 秒 · 点击展开`;
      d.querySelector(".chev").style.display = "";
      d.classList.remove("live");
      await sleep(350);
      d.classList.remove("open");
    } else if (step.t === "act") {
      const line = el('<div class="act"><span class="spinner"></span><span class="tname"></span><span class="targ"></span></div>');
      box.appendChild(line);
      scrollBottom();
      for (const [name, arg] of step.tools) {
        if (myId !== chat._runId) return;
        line.querySelector(".tname").textContent = name + " ·";
        line.querySelector(".targ").textContent = arg;
        scrollBottom();
        await sleep(1150);
      }
      line.classList.add("fade");
      await sleep(480);
      line.remove();
    } else if (step.t === "text") {
      const p = el('<div class="m-text"><span class="cursor"></span></div>');
      box.appendChild(p);
      scrollBottom();
      if (!await typeInto(p, step.text, myId, 24)) return;
      p.querySelector(".cursor").remove();
    } else if (step.t === "usage") {
      await sleep(250);
      const txt = step.text.replace(/effort \w+/, `effort ${activeEffort.id}`);
      box.appendChild(el(`<div class="m-usage">${esc(txt)}</div>`));
      scrollBottom();
    }
  }
}

function updateInputState() {

  chat._fresh = false;

function stopSession() {
  if (!chat._streaming) { flashHint("当前没有进行中的回复"); return; }
  chat._runId++;
  chat._loop++;
  chat._streaming = false;
  const mount = chat.querySelector(".live-slot");
  mount.querySelectorAll(".cursor").forEach(c => c.remove());
  mount.querySelectorAll(".act").forEach(a => a.remove());
  mount.querySelectorAll(".think.live").forEach(t => {
    t.classList.remove("live", "open");
    t.querySelector(".lb").textContent = "已中断";
    const chev = t.querySelector(".chev");
    if (chev) chev.style.display = "";
  });
  mount.appendChild(el('<div class="m-sys">已停止会话 · 本轮回复已中断</div>'));
  updateInputState();
  flashHint("已停止会话", "warn");
  scrollBottom();
}
/* 发送核心：图先文后落消息，按内容选剧本（err 截图 → 识图搜索） */
async function doSend(imgs, text) {
  if (!imgs.length && !text) return false;
  if (imgs.length && !activeModel().img) {
    flashHint("当前模型不支持附件，请先切换模型", "warn");
    const g = chat.querySelector(".img-guard");
    g.classList.remove("shake"); void g.offsetWidth; g.classList.add("shake");
    return false;
  }
  chat._runId++;
  if (chat.querySelector(".ch-empty").classList.contains("show")) {
    chat.querySelector(".ch-empty").classList.remove("show");
    chat.querySelector(".ch-msgs").style.display = "";
    if (!chat._fresh) buildHistory();
  }
  const mount = chat.querySelector(".live-slot");
  mount.innerHTML = "";
  mount.appendChild(userRow(imgs, text));
  at.length = 0;
  renderStrip();
  updateGuard();
  const ta = chat.querySelector("textarea");
  ta.value = "";
  autoGrow();
  scrollBottom();
  chat._streaming = true;
  updateInputState();
  await sleep(480);
  const counts = tally(imgs);
  const script = counts.img && imgs.some(x => x.id === "err") ? REPLY_IMG()
    : imgs.length ? REPLY_ACK(counts)
    : REPLY_PLAIN();
  await playScript(script);
  chat._streaming = false;
  updateInputState();
  return true;
}
async function sendMsg() {
  if (chat._streaming) return;
  const imgs = at.filter(x => !x.enc);
  const text = chat.querySelector("textarea").value.trim();
  if (!imgs.length && !text) { flashHint("说点什么，或添加附件"); return; }
  if (at.some(x => x.enc)) return;
  chat._loop++;
  await doSend(imgs, text);
}

/* ================= 跨屏同步（模型 / 思考程度） ================= */
function broadcastSync() {
  if (window.parent === window) return;
  window.parent.postMessage({ event: "sync", from: MY_ID, md: activeModel().value, ef: activeEffort.id }, "*");
}
function applySync(d) {
  if (typeof d.md === "string" && MODELS.some(m => m.value === d.md) && d.md !== activeModel().value) {
    mdPick.cur = d.md;
    syncModel();
    updateGuard();
  }
  const ef = EF_FAKE.find(x => x.id === d.ef);
  if (ef && ef.id !== activeEffort.id) { activeEffort = ef; syncEffort(); }
}

/* ================= 初始化 ================= */
function initChat() {
  chat.classList.add("show");
  chat._runId = 0;
  chat._loop = 0;
  chat._streaming = false;
  chat._fresh = false;
  buildHistory();

  chat.querySelector(".back").addEventListener("click", () => flashHint("返回会话列表（原型内未接线）"));
  chat.querySelector(".ch-stop").addEventListener("click", stopSession);
  /* ＋ 菜单（工具行右端）：拍照 / 图片 / 视频 / 文件 */
  const plusWrap = chat.querySelector(".plus-wrap");
  const plusPop = chat.querySelector(".plus-pop");
  chat.querySelector(".ch-plus").addEventListener("click", e => {
    e.stopPropagation();
    if (chat._streaming) return;
    plusPop.classList.toggle("show");
  });
  plusPop.addEventListener("click", e => {
    const btn = e.target.closest(".opt");
    if (!btn) return;
    plusPop.classList.remove("show");
    if (chat._streaming) return;
    if (btn.dataset.act === "camera") openCamera();
    else if (btn.dataset.act === "img") openPicker("img");
    else if (btn.dataset.act === "video") openPicker("video");
    else if (btn.dataset.act === "file") openPicker("file");
  });

  const ta = chat.querySelector("textarea");
  ta.addEventListener("input", autoGrow);
  ta.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMsg(); } });
  chat.querySelector(".ch-send").addEventListener("click", sendMsg);

  /* 附件条：移除 / 续选 / 点缩略图放大 */
  const strip = chat.querySelector(".at-strip");
  strip.addEventListener("click", e => {
    const rm = e.target.closest(".at-rm");
    if (rm) { at.splice(+rm.dataset.i, 1); renderStrip(); updateGuard(); updateInputState(); return; }
    if (e.target.closest(".at-add")) { if (!chat._streaming) openPicker("img"); return; }
    const th = e.target.closest(".at-thumb");
    if (th) { const it2 = at[+th.dataset.i]; openLb(it2.src, at.length, +th.dataset.i); return; }
    if (e.target.closest(".at-file")) flashHint("文件预览（原型内未接线）");
  });

  /* 守卫行点击 → 打开模型浮层（stopPropagation 防被 document 关闭） */
  chat.querySelector(".img-guard").addEventListener("click", e => {
    e.stopPropagation();
    chat.querySelector(".md-chip").click();
  });

  /* 模型浮层 */
  const mdWrap = chat.querySelector(".md-wrap");
  const mdPop = chat.querySelector(".md-pop");
  chat.querySelector(".md-chip").addEventListener("click", e => {
    e.stopPropagation();
    if (!mdPop.classList.contains("show")) renderMdOpts();
    mdPop.classList.toggle("show");
  });
  mdPop.addEventListener("click", e => {
    const btn = e.target.closest(".opt");
    if (!btn) return;
    mdPop.classList.remove("show");
    if (btn.dataset.md === activeModel().value) return;
    setModel(btn.dataset.md);
    if (activeModel().img || !at.length) flashHint(`模型 · ${activeModel().displayName}`, "ok");
  });

  /* 思考程度浮层 */
  const efWrap = chat.querySelector(".ef-wrap");
  const efPop = chat.querySelector(".ef-pop");
  chat.querySelector(".ef-chip").addEventListener("click", e => {
    e.stopPropagation();
    if (!efPop.classList.contains("show")) renderEfOpts();
    efPop.classList.toggle("show");
  });
  efPop.addEventListener("click", e => {
    const btn = e.target.closest(".opt");
    if (!btn) return;
    const ef = EF_FAKE.find(x => x.id === btn.dataset.ef);
    efPop.classList.remove("show");
    if (!ef || ef.id === activeEffort.id) return;
    activeEffort = ef;
    syncEffort();
    flashHint(`思考程度 · ${ef.name}，随下一条消息生效`, "ok");
    broadcastSync();
  });
  document.addEventListener("click", e => {
    if (!mdWrap.contains(e.target)) mdPop.classList.remove("show");
    if (!efWrap.contains(e.target)) efPop.classList.remove("show");
    if (!plusWrap.contains(e.target)) plusPop.classList.remove("show");
  });

  /* 消息区附件：视频卡 / 文件卡 / 图片 → 预览或提示 */
  chat.querySelector(".ch-msgs").addEventListener("click", e => {
    const vc = e.target.closest(".v-card");
    if (vc) {
      const grid = vc.closest(".g-grid");
      const all = Array.from(grid.querySelectorAll(".gi, .v-card"));
      openLb(vc.dataset.src, all.length, all.indexOf(vc));
      return;
    }
    if (e.target.closest(".f-card")) { flashHint("文件预览（原型内未接线）"); return; }
    const im = e.target.closest("img.gi");
    if (!im) return;
    const grid = im.closest(".g-grid");
    const all = grid ? Array.from(grid.querySelectorAll(".gi")) : [im];
    openLb(im.src, all.length, all.indexOf(im));
  });

  /* 全屏预览关闭 */
  const lb = chat.querySelector(".lb-mask");
  lb.addEventListener("click", () => lb.classList.remove("show"));

  /* 选择面板：分段 / 相册 / 网格（图+视频）/ 文件列表 */
  chat.querySelector(".pk-cancel").addEventListener("click", closePicker);
  chat.querySelector(".pk-done").addEventListener("click", commitPicker);

    if (s) setSeg(s.dataset.seg);
  });
  chat.querySelector(".pk-tabs").addEventListener("click", e => {
    const t = e.target.closest(".pk-tab");
    if (t) setAlbum(t.dataset.album);
  });
  chat.querySelector(".pk-grid").addEventListener("click", e => {
    const it = e.target.closest(".pk-it");
    if (it) pkToggle(it.dataset.id);
  });
  chat.querySelector(".pk-list").addEventListener("click", e => {
    const f = e.target.closest(".pk-file");
    if (f) pkToggle(f.dataset.id);
  });

  /* 系统相机 */
  chat.querySelector(".cam-x").addEventListener("click", closeCamera);
  chat.querySelector(".cam-shutter").addEventListener("click", shoot);

  /* 初始形态 */
  syncModel();
  syncEffort();
  updateInputState();
  if (STATE0 === "attach") attachIds(["sunset", "err", "mountain"], true);
  if (STATE0 === "picker") { setAlbum(ALBUM0); openPicker(); }
  if (DEMO0) autoLoop();
}

/* ================= 展台遥控（postMessage） ================= */
window.addEventListener("message", e => {
  const d = e.data;
  if (!d || typeof d !== "object") return;
  if (d.event === "sync" && d.from !== MY_ID) { applySync(d); return; }
  const ta = chat.querySelector("textarea");
  switch (d.cmd) {
    case "plus": chat.querySelector(".ch-plus").click(); break;
    case "camera":
      if (!chat._streaming) { openCamera(); setTimeout(() => shoot(), 850); }
      break;
    case "pick": if (!chat._streaming) openPicker("img"); break;
    case "video": if (!chat._streaming) openPicker("video"); break;
    case "file": if (!chat._streaming) openPicker("file"); break;
    case "album": setAlbum(d.album || "recent"); break;
    case "selshots": {
      if (pk.seg !== "img") { pk.seg = "img"; pk.sel = []; }
      const alb = ALBUMS.find(a => a.id === pk.album) || ALBUMS[0];
      pk.sel = alb.items.slice(0, Math.min(2, Math.max(0, MAX - at.length)));
      if (chat.querySelector(".pk-mask").classList.contains("show")) renderPicker();
      else openPicker();
      break;
    }
    case "pkdone": commitPicker(); break;
    case "pkcancel": closePicker(); break;
    case "add": {
      const pool = ["sunset", "mountain", "city", "abstract"];
      attachIds([pool[Math.floor(Math.random() * pool.length)]], true);
      break;
    }
    case "fill": ta.value = "搜一下这个报错怎么解决"; autoGrow(); break;
    case "clear":
      at.length = 0; renderStrip(); updateGuard(); updateInputState();
      ta.value = ""; autoGrow();
      break;
    case "send": sendMsg(); break;
    case "sendimg": runImgDemoOnce(); break;
    case "sendonly": sendOnly(); break;
    case "sendfile": sendFileDemo(); break;
    case "reject": demoReject(); break;
    case "replay": replayDemo(); break;
    case "stop": stopSession(); break;
    case "lightbox": openFirstHistoryImage(); break;
    case "empty": showEmpty(); break;
    case "modelpop": chat.querySelector(".md-chip").click(); break;
  }
});

initChat();
</script>
</body>
</html>
