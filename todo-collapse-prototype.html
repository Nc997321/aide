<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TaskList 自动折叠 · UX 原型</title>
<style>
  /* —— 配色：贴近项目 glass 暗色主题 + 铜色 accent —— */
  :root {
    --bg-deep: #16181d;
    --bg-base: #1c1f26;
    --surface: #242932;
    --surface-hover: #2c323d;
    --accent: #c9a572;
    --accent-gradient: linear-gradient(135deg, #d8b87f, #b08850);
    --text-primary: #e8eaf0;
    --text-secondary: #aab2c0;
    --text-muted: #6b7380;
    --border: #2a2f3a;
    --border-subtle: #232833;
    --radius-sm: 6px;
    --ease-t: 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
    --font-mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--font-mono);
    background: var(--bg-deep);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* —— 顶部说明栏（原型用，项目里没有） —— */
  .proto-bar {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-secondary);
    flex-wrap: wrap;
  }
  .proto-bar .title { font-weight: 600; color: var(--text-primary); margin-right: 8px; }
  .proto-bar button {
    padding: 5px 12px;
    border: 1px solid var(--border);
    background: var(--bg-base);
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
    font-family: inherit;
    font-size: 11.5px;
    cursor: pointer;
    transition: all var(--ease-t);
  }
  .proto-bar button:hover { background: var(--surface-hover); color: var(--text-primary); border-color: var(--accent); }
  .proto-bar .hint { color: var(--text-muted); font-size: 11px; }
  .proto-bar .sep { width: 1px; height: 18px; background: var(--border); }
  .proto-bar label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; color: var(--text-muted); font-size: 11px; }

  /* —— chat-panel：复刻项目布局 —— */
  .chat-panel {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg-deep);
  }

  /* —— TaskListPanel —— */
  .task-list-panel {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    padding: 4px 10px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-base);
    font-size: 12px;
  }

  /* 摘要条（常驻头部，点击 toggle） */
  .task-summary {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 6px 10px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 12px;
    cursor: pointer;
    border-radius: var(--radius-sm);
    text-align: left;
    width: 100%;
    transition: background var(--ease-t);
  }
  .task-summary:hover { background: var(--surface); }
  .task-summary-icon {
    flex-shrink: 0;
    width: 15px;
    height: 15px;
    border-radius: 4px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    transition: all var(--ease-t);
  }
  /* pending：空圈 */
  .task-summary-icon[data-state="pending"] {
    color: transparent;
    border: 1.5px solid var(--text-muted);
  }
  /* in_progress：accent 环 + 呼吸 */
  .task-summary-icon[data-state="in_progress"] {
    color: var(--accent);
    box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--accent) 20%, transparent);
    animation: breathe 1.4s ease-in-out infinite;
  }
  /* completed：accent 填充 + 勾 */
  .task-summary-icon[data-state="completed"] {
    background: var(--accent-gradient);
    color: var(--bg-deep);
    box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .task-summary-icon[data-state="completed"]::after { content: "✓"; font-weight: 700; }
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--accent) 20%, transparent); }
    50% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 35%, transparent); }
  }

  .task-summary-count {
    flex-shrink: 0;
    font-size: 10.5px;
    color: var(--text-muted);
  }
  .task-summary-current {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-primary);
    font-weight: 600;
  }
  .task-summary-current[data-state="all-done"] { color: var(--text-muted); font-weight: 400; }
  .task-summary-current[data-state="pending-only"] { color: var(--text-muted); font-weight: 400; }

  /* caret：三角旋转 */
  .task-summary-caret {
    flex-shrink: 0;
    width: 0; height: 0;
    border-top: 4px solid transparent;
    border-bottom: 4px solid transparent;
    border-left: 5px solid var(--text-muted);
    opacity: 0.7;
    transition: transform var(--ease-t);
  }
  .task-summary-caret.open { transform: rotate(90deg); }

  /* body：grid 0fr→1fr 高度过渡（核心动画） */
  .task-list-body-wrap {
    display: grid;
    grid-template-rows: 0fr;
    transition: grid-template-rows var(--ease-t);
  }
  .task-list-body-wrap.open { grid-template-rows: 1fr; }
  .task-list-body {
    overflow: hidden;
  }
  .task-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 7px 10px;
    color: var(--text-secondary);
    border-radius: var(--radius-sm);
  }
  .task-item + .task-item { border-top: 1px solid var(--border-subtle); }
  .task-item-completed { color: var(--text-muted); }
  .task-item-completed .task-text { text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--text-muted) 60%, transparent); }
  .task-item-in_progress { color: var(--text-primary); }
  .task-item-in_progress .task-text { font-weight: 600; }
  .task-icon {
    flex-shrink: 0;
    width: 15px; height: 15px;
    margin-top: 1px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px;
    transition: all var(--ease-t);
  }
  .task-icon[data-state="pending"] { color: transparent; border: 1.5px solid var(--text-muted); }
  .task-icon[data-state="in_progress"] {
    color: var(--accent);
    box-shadow: 0 0 0 2.5px color-mix(in srgb, var(--accent) 20%, transparent);
    animation: breathe 1.4s ease-in-out infinite;
  }
  .task-icon[data-state="completed"] {
    background: var(--accent-gradient);
    color: var(--bg-deep);
    box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 40%, transparent);
  }
  .task-icon[data-state="completed"]::after { content: "✓"; font-weight: 700; }
  .task-text {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    flex: 1;
  }
  /* 新 task 入场：从上淡入下落，贴近「一条条建出来」的观感；仅展开态可见 */
  @keyframes task-enter {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .task-item--enter { animation: task-enter 0.26s var(--ease-t); }

  /* —— 消息区（flex:1 收缩让位） —— */
  .chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg { padding: 10px 14px; background: var(--bg-base); border-radius: 8px; border: 1px solid var(--border-subtle); font-size: 13px; color: var(--text-secondary); }
  .msg.user { align-self: flex-end; background: color-mix(in srgb, var(--accent) 12%, var(--bg-base)); border-color: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--text-primary); }
  .chat-empty { margin: auto; color: var(--text-muted); font-size: 13px; }

  /* —— 输入框区（按内容高度，被挤压时底部会被裁） —— */
  .chat-input-area {
    flex-shrink: 0;
    padding: 10px 14px 14px;
    border-top: 1px solid var(--border);
    background: var(--bg-deep);
  }
  .chat-input-box {
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--bg-base);
    padding: 8px;
  }
  textarea {
    width: 100%;
    height: 56px;
    resize: none;
    border: none;
    background: transparent;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 13px;
    outline: none;
    padding: 6px 8px;
  }
  textarea::placeholder { color: var(--text-muted); }
  .chat-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 8px 0;
    border-top: 1px solid var(--border-subtle);
    margin-top: 4px;
    font-size: 11px;
    color: var(--text-muted);
  }
  .chat-toolbar .chip { padding: 3px 10px; border: 1px solid var(--border); border-radius: 6px; }
  .chat-toolbar .send {
    margin-left: auto;
    padding: 6px 16px;
    background: var(--accent-gradient);
    color: var(--bg-deep);
    border: none;
    border-radius: 6px;
    font-family: inherit;
    font-weight: 600;
    font-size: 12px;
    cursor: pointer;
  }

  /* —— 输入框被裁的视觉提示（原型演示用） —— */
  .panel-stat {
    position: fixed;
    right: 14px;
    bottom: 14px;
    z-index: 10;
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 10.5px;
    color: var(--text-muted);
    pointer-events: none;
  }
  .panel-stat b { color: var(--text-secondary); }
  .panel-stat .danger { color: #e07a7a; }

  @media (prefers-reduced-motion: reduce) {
    .task-list-body-wrap, .task-summary-caret, .task-summary-icon, .task-icon { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>

<!-- 原型控制栏（项目里没有，仅用于触发场景） -->
<div class="proto-bar">
  <span class="title">TaskList 自动折叠 · 原型</span>
  <button id="btn-batch">批量创建 5 个</button>
  <button id="btn-many">极端：创建 30 个</button>
  <button id="btn-trickle">逐个创建（每 350ms）</button>
  <button id="btn-advance">推进一个状态</button>
  <button id="btn-clear">清空</button>
  <span class="sep"></span>
  <label><input type="checkbox" id="auto-collapse" checked /> 启用自动收起</label>
  <span class="hint">观察：创建后约 0.8s 自动收起成摘要条；点击摘要条手动展开/收起</span>
</div>

<!-- chat-panel -->
<div class="chat-panel">
  <!-- TaskListPanel -->
  <div class="task-list-panel">
    <button class="task-summary" id="summary" type="button">
      <span class="task-summary-icon" id="summary-icon" data-state="pending"></span>
      <span class="task-summary-count" id="summary-count">0/0</span>
      <span class="task-summary-current" id="summary-current">暂无待办</span>
      <span class="task-summary-caret" id="summary-caret"></span>
    </button>
    <div class="task-list-body-wrap" id="body-wrap">
      <div class="task-list-body" id="body"></div>
    </div>
  </div>

  <!-- 消息区 -->
  <div class="chat-messages" id="messages">
    <div class="msg user">帮我把这个函数重构成纯函数，并加单元测试</div>
    <div class="msg">好的，我来分析这个函数的副作用，然后拆成可测试的纯函数。先建一份待办清单。</div>
    <div class="chat-empty" id="empty-hint" style="display:none;">（消息区会被 todo 挤压——这就是「输入框被覆盖」的来源）</div>
  </div>

  <!-- 输入框区 -->
  <div class="chat-input-area">
    <div class="chat-input-box">
      <textarea placeholder="输入消息…"></textarea>
      <div class="chat-toolbar">
        <span class="chip">claude-sonnet-5</span>
        <span class="chip">effort: high</span>
        <button class="send">发送</button>
      </div>
    </div>
  </div>
</div>

<div class="panel-stat" id="stat">
  <b>TaskList 高度：</b><span id="stat-h">—</span>px ·
  <b>折叠：</b><span id="stat-col">否</span> ·
  <b>输入框可见：</b><span id="stat-vis">是</span>
</div>

<script>
  // —— useTaskListCollapse 等价状态机（复刻 composable 逻辑） ——
  const STABLE_MS = 800;
  let tasks = [];
  let collapsed = false;
  let timer = null;
  let prevLen = 0;
  let autoEnabled = true;

  const summaryEl = document.getElementById("summary");
  const summaryIcon = document.getElementById("summary-icon");
  const summaryCount = document.getElementById("summary-count");
  const summaryCurrent = document.getElementById("summary-current");
  const summaryCaret = document.getElementById("summary-caret");
  const bodyWrap = document.getElementById("body-wrap");
  const body = document.getElementById("body");
  const statH = document.getElementById("stat-h");
  const statCol = document.getElementById("stat-col");
  const statVis = document.getElementById("stat-vis");
  const emptyHint = document.getElementById("empty-hint");

  function clearTimer() { if (timer) { clearTimeout(timer); timer = null; } }
  function scheduleCollapse() {
    if (!autoEnabled) return; // 演示对照：禁用时永不自动收起（复现问题）
    clearTimer();
    timer = setTimeout(() => { collapsed = true; render(); }, STABLE_MS);
  }

  // length 增长 → 展开 + 重启计时（复刻 composable 的 watch）
  function onLenChange(len) {
    if (len > prevLen) {
      collapsed = false;
      scheduleCollapse();
    }
    prevLen = len;
  }

  // 用户手动 toggle → 清计时器，保持当前态直到下次新建
  function toggleCollapse() {
    collapsed = !collapsed;
    clearTimer();
    render();
  }
  summaryEl.addEventListener("click", toggleCollapse);

  // —— 状态文本/icon 计算 ——
  function stateOf(summary) {
    const inProg = tasks.find(t => t.status === "in_progress");
    const completed = tasks.filter(t => t.status === "completed").length;
    const total = tasks.length;
    if (total === 0) return { icon: "pending", count: "0/0", text: "暂无待办", textState: "pending-only" };
    if (inProg) return { icon: "in_progress", count: `${completed}/${total}`, text: inProg.activeForm || inProg.subject, textState: "in_progress" };
    if (completed === total) return { icon: "completed", count: `${total}/${total}`, text: "全部完成", textState: "all-done" };
    return { icon: "pending", count: `${completed}/${total}`, text: `${total - completed} 项待办`, textState: "pending-only" };
  }

  const knownIds = new Set();
  function render() {
    const s = stateOf();
    summaryIcon.dataset.state = s.icon;
    summaryCount.textContent = s.count;
    summaryCurrent.textContent = s.text;
    summaryCurrent.dataset.state = s.textState;
    summaryCaret.classList.toggle("open", !collapsed);
    bodyWrap.classList.toggle("open", !collapsed && tasks.length > 0);

    // 增量渲染：新 task 入场动画 + append，已有 task 只更新状态（不重建、不重播动画）
    // —— 贴近真实场景：Claude 逐个 TaskCreate，todo 一条条建出来。
    for (const t of tasks) {
      let el = body.querySelector(`.task-item[data-id="${t.id}"]`);
      if (!el) {
        el = document.createElement("div");
        el.dataset.id = t.id;
        el.className = `task-item task-item-${t.status} task-item--enter`;
        el.innerHTML = `<span class="task-icon" data-state="${t.status}"></span><span class="task-text"></span>`;
        body.appendChild(el);
        knownIds.add(t.id);
        // 入场动画播一帧后移除标记，避免后续 className 更新重播
        requestAnimationFrame(() => el.classList.remove("task-item--enter"));
      }
      el.className = `task-item task-item-${t.status}`;
      el.querySelector(".task-icon").dataset.state = t.status;
      el.querySelector(".task-text").textContent = t.status === "in_progress" && t.activeForm ? t.activeForm : t.subject;
    }

    // 状态统计（演示输入框是否被裁）
    requestAnimationFrame(updateStat);
  }

  function updateStat() {
    const panel = document.querySelector(".task-list-panel");
    const inputArea = document.querySelector(".chat-input-area");
    const panelH = panel.getBoundingClientRect().height;
    statH.textContent = Math.round(panelH);
    statCol.textContent = collapsed ? "是" : "否";
    // 输入框底部是否在视口内（chat-panel overflow:hidden 会裁掉超出部分）
    const panelRect = document.querySelector(".chat-panel").getBoundingClientRect();
    const inputRect = inputArea.getBoundingClientRect();
    const vis = inputRect.bottom <= panelRect.bottom + 1;
    statVis.textContent = vis ? "是" : "否（被裁！）";
    statVis.className = vis ? "" : "danger";
  }

  window.addEventListener("resize", updateStat);

  // —— 场景按钮 ——
  let idc = 0;
  function makeTask(subject, activeForm) { return { id: ++idc, subject, status: "pending", activeForm }; }

  // 批量创建：模拟 Claude 逐个 TaskCreate，一条条流式出现（带入场动画），
  // 建完后过一会推进第一个为 in_progress，再 1.2s 自动折叠。
  let batchTimer = null;
  const btnBatch = document.getElementById("btn-batch");
  btnBatch.addEventListener("click", () => {
    if (batchTimer) { clearInterval(batchTimer); batchTimer = null; }
    const list = ["分析函数副作用", "拆分为纯函数", "补充单元测试", "运行测试验证", "更新文档说明"];
    let i = 0;
    batchTimer = setInterval(() => {
      if (i >= list.length) {
        clearInterval(batchTimer); batchTimer = null;
        // 建完后过一会开始执行第一个（真实感：摘要条显示「正在…」）
        setTimeout(() => {
          if (tasks[0]) { tasks[0].status = "in_progress"; tasks[0].activeForm = "正在分析函数副作用"; render(); }
        }, 500);
        return;
      }
      tasks = [...tasks, makeTask(list[i++])];
      onLenChange(tasks.length);
      render();
    }, 260);
  });

  document.getElementById("btn-many").addEventListener("click", () => {
    tasks = Array.from({ length: 30 }, (_, i) => makeTask(`待办事项 ${i + 1}`));
    onLenChange(tasks.length);
    render();
  });

  let trickleTimer = null;
  const btnTrickle = document.getElementById("btn-trickle");
  btnTrickle.addEventListener("click", () => {
    if (trickleTimer) { clearInterval(trickleTimer); trickleTimer = null; btnTrickle.textContent = "逐个创建（每 350ms）"; return; }
    btnTrickle.textContent = "停止逐个创建";
    let i = 0;
    const list = ["读取配置文件", "解析依赖关系", "生成构建图", "执行构建", "写入产物"];
    trickleTimer = setInterval(() => {
      if (i >= list.length) { clearInterval(trickleTimer); trickleTimer = null; btnTrickle.textContent = "逐个创建（每 350ms）"; return; }
      tasks = [...tasks, makeTask(list[i++])];
      onLenChange(tasks.length);
      render();
    }, 350);
  });

  document.getElementById("btn-advance").addEventListener("click", () => {
    const inProg = tasks.find(t => t.status === "in_progress");
    if (inProg) {
      inProg.status = "completed";
      const next = tasks.find(t => t.status === "pending");
      if (next) { next.status = "in_progress"; next.activeForm = "正在" + next.subject; }
    } else {
      const next = tasks.find(t => t.status === "pending");
      if (next) { next.status = "in_progress"; next.activeForm = "正在" + next.subject; }
    }
    // 状态变化不改长度，不触发展开；折叠态下摘要条仍实时更新
    render();
  });

  document.getElementById("btn-clear").addEventListener("click", () => {
    if (trickleTimer) { clearInterval(trickleTimer); trickleTimer = null; btnTrickle.textContent = "逐个创建（每 350ms）"; }
    if (batchTimer) { clearInterval(batchTimer); batchTimer = null; }
    tasks = [];
    prevLen = 0;
    collapsed = false;
    clearTimer();
    knownIds.clear();
    body.innerHTML = "";
    render();
  });

  document.getElementById("auto-collapse").addEventListener("change", (e) => {
    autoEnabled = e.target.checked;
    if (autoEnabled && tasks.length > 0 && !collapsed) scheduleCollapse();
    else if (!autoEnabled) clearTimer();
  });

  // 初始
  render();
</script>
</body>
</html>
