<!DOCTYPE html>
<!-- 2026-08-09 v2 聊天域「代理活动装饰色」候选原型：四主题全量。
     新增 ThemeTokens 槽位 agentAccent，每主题独立选色；A 列一律为现状（= 该主题 info 值，对照）。
     组件结构 & 样式 1:1 复制自 ThinkingBlock / SubagentCallBlock / ToolCallBlock(bgchip) /
     ToolCallGroup(bg) / TurnUsageBadge，仅把 --aide-info 换成 --cand。
     各 section 用该主题真实 token 渲染（玻璃主题的 ambientScene 也搬过来了）。 -->
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>agentAccent 选色原型 · 四主题</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body {
    background: #0c0c10;
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    padding: 24px 20px 48px;
    color: #ccc;
  }
  h1 { font-size: 15px; font-weight: 600; margin-bottom: 4px; color: #eee; }
  .sub { font-size: 12px; color: #888; margin-bottom: 20px; }

  .theme-section { margin-bottom: 28px; border-radius: 14px; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
  .theme-title {
    font-size: 13px; font-weight: 700; padding: 8px 14px;
    background: rgba(127,127,127,.12); color: #ddd; letter-spacing: .04em;
  }
  .theme-title .cur { font-weight: 400; color: #999; font-size: 11.5px; margin-left: 10px; }
  .cols { display: flex; gap: 12px; align-items: flex-start; padding: 14px; }
  .col { flex: 1; min-width: 0; }
  .col-label {
    font-size: 11.5px; font-weight: 600;
    padding: 5px 9px; margin-bottom: 8px;
    border: 1px solid var(--t-border); border-radius: 6px;
    background: var(--t-raised);
    color: var(--t-text2);
    display: flex; align-items: center; gap: 7px;
  }
  .swatch { width: 11px; height: 11px; border-radius: 3px; background: var(--cand); flex-shrink: 0; border: 1px solid rgba(127,127,127,.35); }
  .col-label .hex { font-family: ui-monospace, Consolas, monospace; font-size: 10px; color: var(--t-textm); }

  /* 模拟 .msg-turn 聊天列 */
  .turn {
    border: 1px solid var(--t-bsub);
    border-radius: var(--t-rad);
    background: var(--t-raised);
    padding: 9px 11px;
    display: flex; flex-direction: column; gap: 7px;
    box-shadow: var(--t-inset);
  }
  .msg-text { font-size: 12.5px; color: var(--t-text1); line-height: 1.6; }
  .zone { font-size: 9.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--t-textm); margin: 4px 0 -2px; }

  /* ===== ThinkingBlock ===== */
  .thinking-head { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; color: var(--t-textm); }
  .caret {
    width: 0; height: 0;
    border-top: 4px solid transparent; border-bottom: 4px solid transparent;
    border-left: 5px solid var(--t-textm); opacity: .7; transform: rotate(90deg);
  }
  .thinking-label { font-weight: 600; color: var(--t-text2); }
  .thinking-count { font-size: 10.5px; font-family: ui-monospace, Consolas, monospace; color: var(--t-textm); }
  .thinking-body {
    margin: 4px 0 6px; padding: 4px 10px;
    border-left: 2px solid color-mix(in srgb, var(--cand) 40%, transparent);
    font-size: 11.5px; line-height: 1.6; color: var(--t-textm); font-style: italic; opacity: .85;
  }

  /* ===== SubagentCallBlock ===== */
  .sa {
    display: flex; margin: 4px 0; font-size: 11.5px;
    border: 1px solid var(--t-bsub);
    border-left: 3px solid var(--cand);
    border-radius: var(--t-rad);
    background: linear-gradient(90deg, color-mix(in srgb, var(--cand) 5%, transparent), var(--t-bg) 40%);
    overflow: hidden;
    box-shadow: var(--t-inset);
  }
  .sa-content { flex: 1; min-width: 0; padding: 2px 0; }
  .sa-head { display: flex; align-items: center; gap: 8px; padding: 7px 11px; font-size: 12px; color: var(--t-text2); }
  .sa-role { font-weight: 600; color: var(--t-text1); flex-shrink: 0; }
  .sa-type {
    flex-shrink: 0; font-size: 9.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
    color: var(--cand);
    background: color-mix(in srgb, var(--cand) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--cand) 25%, transparent);
    border-radius: 3px; padding: 1px 5px;
  }
  .sa-desc { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--t-textm); }
  .sa-timeline {
    margin: 0 11px 9px 20px;
    border-left: 1px dashed color-mix(in srgb, var(--cand) 30%, transparent);
    padding-left: 11px; display: flex; flex-direction: column; gap: 5px;
  }
  .sa-thinking { font-size: 11px; color: var(--t-textm); font-style: italic; opacity: .85; }
  .sa-tool {
    border: 1px solid var(--t-bsub); border-radius: var(--t-rads);
    background: var(--t-deep); padding: 5px 9px;
    font-size: 11px; font-family: ui-monospace, Consolas, monospace; color: var(--t-textm);
    display: flex; align-items: center; gap: 7px;
  }
  .sa-tool .tname { color: var(--t-text2); }

  /* ===== ToolCallBlock bgchip ===== */
  .toolrow {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--t-bsub); border-radius: var(--t-rads);
    background: var(--t-deep); padding: 5px 9px;
    font-size: 11px; font-family: ui-monospace, Consolas, monospace;
  }
  .toolrow .tname { color: var(--t-text2); }
  .toolrow .tpath { color: var(--t-textm); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bgchip {
    flex-shrink: 0; font-size: 10.5px; padding: 1px 8px; border-radius: 999px;
    color: var(--cand);
    background: color-mix(in srgb, var(--cand) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--cand) 25%, transparent);
    white-space: nowrap;
  }

  /* ===== TurnUsageBadge ===== */
  .turn-usage { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; font-family: ui-monospace, Consolas, monospace; }
  .tu-in { color: var(--cand); }
  .tu-out { color: var(--t-success); }
  .tu-cost { color: var(--t-textm); }
</style>
</head>
<body>
  <h1>聊天域「代理活动装饰色」选色 — 四主题</h1>
  <p class="sub">新增槽位 agentAccent（思考竖线 / 子代理卡 / 后台徽章 / 用量徽章↓），每主题独立取值；A 列 = 现状（该主题 info 值，选它即不变）。浅色主题注意文字对比度。</p>
  <div id="root"></div>

<script>
  // 每主题：真实 token（bg/文字/边框/圆角/受光/场景底）+ 候选色
  const THEMES = [
    {
      name: "warm-dark（暖色精修 · 暗）",
      vars: {
        "--t-scene": "#1a1820",
        "--t-bg": "#1a1820", "--t-deep": "#141218", "--t-raised": "#221f29",
        "--t-text1": "#ece5db", "--t-text2": "#b3aa9c", "--t-textm": "#7d7568",
        "--t-success": "#8bc48a",
        "--t-border": "rgba(255,214,160,.09)", "--t-bsub": "rgba(255,214,160,.045)",
        "--t-inset": "inset 0 1px 0 rgba(255,235,210,.07)",
        "--t-rad": "9px", "--t-rads": "6px",
      },
      candidates: [
        { name: "A · 现状蓝",   hex: "#7eb8d8" },
        { name: "B · 暖灰紫",   hex: "#a68ec0" },
        { name: "C · 暖石板蓝", hex: "#8fa3b8" },
        { name: "D · 柔铜",     hex: "#c9a06c" },
      ],
    },
    {
      name: "catppuccin（靛蓝 · 暗）",
      vars: {
        "--t-scene": "#1e1e2e",
        "--t-bg": "#1e1e2e", "--t-deep": "#11111b", "--t-raised": "#313244",
        "--t-text1": "#cdd6f4", "--t-text2": "#a6adc8", "--t-textm": "#6c7086",
        "--t-success": "#a6e3a1",
        "--t-border": "rgba(255,255,255,.06)", "--t-bsub": "rgba(255,255,255,.03)",
        "--t-inset": "inset 0 1px 0 rgba(255,255,255,.06)",
        "--t-rad": "8px", "--t-rads": "4px",
      },
      candidates: [
        { name: "A · 现状青",  hex: "#89dceb" },
        { name: "B · 紫 mauve", hex: "#cba6f7" },
        { name: "C · 粉 pink",  hex: "#f5c2e7" },
      ],
    },
    {
      name: "glass（极光玻璃 · 暗）",
      vars: {
        "--t-scene": "radial-gradient(560px 380px at 10% -8%, rgba(124,108,255,.32), transparent 65%), radial-gradient(520px 420px at 96% 6%, rgba(64,190,220,.22), transparent 65%), radial-gradient(640px 340px at 60% 112%, rgba(210,110,190,.16), transparent 70%), #0a0b11",
        "--t-bg": "rgba(17,19,29,.52)", "--t-deep": "rgba(8,10,16,.82)", "--t-raised": "rgba(24,26,38,.48)",
        "--t-text1": "#eef0f8", "--t-text2": "#b9bdd0", "--t-textm": "#7c8296",
        "--t-success": "#6ee7a8",
        "--t-border": "rgba(255,255,255,.1)", "--t-bsub": "rgba(255,255,255,.06)",
        "--t-inset": "inset 0 1px 0 rgba(255,255,255,.12)",
        "--t-rad": "10px", "--t-rads": "8px",
      },
      candidates: [
        { name: "A · 现状天蓝", hex: "#7dd3fc" },
        { name: "B · 极光紫",   hex: "#c3b3f7" },
        { name: "C · 极光粉",   hex: "#e0a3d8" },
      ],
    },
    {
      name: "smoky-pink-glass（烟灰粉玻璃 · 浅色）",
      vars: {
        "--t-scene": "radial-gradient(circle at 8% 0%, rgba(255,255,255,.96) 0 17%, transparent 42%), radial-gradient(circle at 100% 0%, rgba(225,196,192,.28) 0 15%, transparent 38%), radial-gradient(circle at 72% 100%, rgba(207,166,160,.18) 0 18%, transparent 42%), linear-gradient(135deg, #faf9fa 0%, #f2eff1 46%, #f8f3f2 100%)",
        "--t-bg": "rgba(243,241,242,.55)", "--t-deep": "rgba(250,250,252,.72)", "--t-raised": "rgba(255,255,255,.72)",
        "--t-text1": "#23262d", "--t-text2": "#5c6470", "--t-textm": "#7b8492",
        "--t-success": "#3f9e69",
        "--t-border": "rgba(124,137,154,.18)", "--t-bsub": "rgba(124,137,154,.10)",
        "--t-inset": "inset 0 1px 0 rgba(255,255,255,.9)",
        "--t-rad": "12px", "--t-rads": "8px",
      },
      candidates: [
        { name: "A · 现状灰蓝", hex: "#7C93B8" },
        { name: "B · 烟熏玫瑰", hex: "#B87F7E" },
        { name: "C · 烟紫",     hex: "#9A7FA8" },
      ],
    },
  ];

  const mock = `
    <div class="turn">
      <p class="msg-text">我先看一下这个文件的实现，然后给你结论。</p>
      <div class="zone">思考块</div>
      <div>
        <div class="thinking-head"><span class="caret"></span><span class="thinking-label">思考</span><span class="thinking-count">328 字</span></div>
        <div class="thinking-body">用户问的是竖线颜色，应该先看 ThinkingBlock 的 border-left 定义，再去主题文件里查实际值……</div>
      </div>
      <div class="zone">子代理卡</div>
      <div class="sa">
        <div class="sa-content">
          <div class="sa-head">
            <span class="sa-role">Agent</span>
            <span class="sa-type">Explore</span>
            <span class="sa-desc">搜索主题 token 的所有消费点</span>
          </div>
          <div class="sa-timeline">
            <p class="sa-thinking">先 grep --aide-info，再逐个文件确认语义……</p>
            <div class="sa-tool"><span class="tname">Grep</span><span>--aide-info in src/</span></div>
          </div>
        </div>
      </div>
      <div class="zone">后台任务徽章</div>
      <div class="toolrow">
        <span class="tname">Bash</span>
        <span class="tpath">pnpm tauri dev</span>
        <span class="bgchip">后台运行中</span>
      </div>
      <div class="zone">用量徽章</div>
      <div class="turn-usage">
        <span class="tu-in">↓ 36.1k</span>
        <span class="tu-out">↑ 1.2k</span>
        <span class="tu-cost">$0.0821</span>
      </div>
    </div>`;

  const root = document.getElementById("root");
  for (const t of THEMES) {
    const sec = document.createElement("div");
    sec.className = "theme-section";
    sec.style.background = t.vars["--t-scene"];
    for (const [k, v] of Object.entries(t.vars)) if (k !== "--t-scene") sec.style.setProperty(k, v);
    const cur = t.candidates[0];
    sec.innerHTML = `<div class="theme-title">${t.name}<span class="cur">现状 info = ${cur.hex}</span></div>`;
    const cols = document.createElement("div");
    cols.className = "cols";
    for (const c of t.candidates) {
      const col = document.createElement("div");
      col.className = "col";
      col.style.setProperty("--cand", c.hex);
      col.innerHTML = `<div class="col-label"><span class="swatch"></span>${c.name}<span class="hex">${c.hex}</span></div>` + mock;
      cols.appendChild(col);
    }
    sec.appendChild(cols);
    root.appendChild(sec);
  }
</script>
</body>
</html>
